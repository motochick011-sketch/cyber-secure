name: cybersecure
description: "A Cyber Secure Check."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0

  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  get_it: ^9.3.0
  injectable: ^3.0.0
  go_router: ^18.1.0
  dio: ^5.11.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

  flutter_svg: ^2.3.0
  lottie: ^3.6.1

  connectivity_plus: ^7.3.2
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  local_auth: ^3.0.2
  crypto: ^3.0.7
  intl: ^0.20.3
  cached_network_image: ^4.0.4
  font_awesome_flutter: ^11.0.0
  skeletonizer: ^3.0.0
  regexpattern: ^2.6.0
  lucide_icons_flutter: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  build_runner: ^2.16.0
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  injectable_generator: ^3.1.3
  flutter_gen_runner: ^5.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_gen:
  output: lib/generated/
  line_length: 80
  integrations:
    flutter_svg: true
    lottie: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/jpg/
    - assets/png/
    - assets/svg/
    - assets/lottiefiles/
